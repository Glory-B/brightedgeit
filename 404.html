<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - BrightEdge IT">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0f172a">
    <title>Page Not Found | BrightEdge IT</title>
    <link rel="canonical" href="https://brightedgeit.com.au/404.html">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preload" href="style.min.css" as="style">
    <link rel="stylesheet" href="style.min.css">
    <style>
        .not-found-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 20%, rgba(255, 107, 53, 0.14), transparent 40%), #0f172a;
        }

        .not-found-card {
            width: min(680px, 100%);
            text-align: center;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 16px;
            padding: 32px 24px;
            backdrop-filter: blur(8px);
        }

        .not-found-logo {
            width: 210px;
            height: auto;
            margin: 0 auto 16px;
            display: block;
        }

        .not-found-copy {
            color: var(--color-text-secondary);
            margin-bottom: 24px;
        }

        .not-found-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
    </style>
    <script async src="https://plausible.io/js/pa-lddVoPgvmweKFGVREUaLe.js"></script>
    <script>
        window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
        plausible.init();
    </script>
</head>

<body>
    <main class="not-found-wrap">
        <section class="not-found-card">
            <img src="assets/logo1.webp" alt="BrightEdge IT Logo" class="not-found-logo" width="1024" height="682"
                decoding="async">
            <h1>Page not found</h1>
            <p class="not-found-copy">The page you’re looking for doesn’t exist or has moved.</p>
            <div class="not-found-actions">
                <a class="cta-btn" href="index.html">Back to Home</a>
                <a class="cta-link" href="contact.html">Contact Support</a>
            </div>
        </section>
    </main>
</body>

</html>
